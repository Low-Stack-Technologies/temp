version: '3.8'

services:
  file-upload-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-upload-server
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP server
      - "8081:8081"  # TCP upload
    environment:
      - STORAGE_DIRECTORY=/app/storage
      - SERVER_PORT=8080
      - BASE_URL=http://localhost:8080
      - MAX_UPLOAD_SIZE_MB=1024
      - MAX_FILES_PER_UPLOAD=10
      - RSA_KEY_PATH=/app/storage/private_key.pem
      - CLEANUP_INTERVAL_SECONDS=60
      - MIN_TTL_SECONDS=60
      - MAX_TTL_SECONDS=2592000
    volumes:
      # Persist storage and database
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - upload-network

networks:
  upload-network:
    driver: bridge
